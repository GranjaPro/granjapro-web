.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;section id=&quot;granjapro-rag-plan&quot; aria-labelledby=&quot;gp-rag-title&quot;&gt;
  &lt;header class=&quot;gp-header&quot;&gt;
    &lt;div&gt;
      &lt;p class=&quot;text-small text-muted&quot;&gt;GranjaPro · arquitetura aprovada&lt;/p&gt;
      &lt;h1 id=&quot;gp-rag-title&quot;&gt;Planejamento completo do RAG&lt;/h1&gt;
      &lt;p class=&quot;text-muted&quot;&gt;Arquitetura, implementação, créditos, segurança e validação.&lt;/p&gt;
    &lt;/div&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;6 fases planejadas&lt;/span&gt;
  &lt;/header&gt;

  &lt;nav class=&quot;viz-controls gp-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;Seções do planejamento&quot;&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;gp-overview&quot; id=&quot;gp-tab-overview&quot; data-section=&quot;overview&quot;&gt;Visão geral&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;gp-architecture&quot; id=&quot;gp-tab-architecture&quot; data-section=&quot;architecture&quot;&gt;Arquitetura&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;gp-phases&quot; id=&quot;gp-tab-phases&quot; data-section=&quot;phases&quot;&gt;Fases&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;gp-credits&quot; id=&quot;gp-tab-credits&quot; data-section=&quot;credits&quot;&gt;Créditos e ledger&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;gp-security&quot; id=&quot;gp-tab-security&quot; data-section=&quot;security&quot;&gt;Segurança&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;gp-validation&quot; id=&quot;gp-tab-validation&quot; data-section=&quot;validation&quot;&gt;Validação e riscos&lt;/button&gt;
  &lt;/nav&gt;

  &lt;main class=&quot;gp-main&quot;&gt;
    &lt;section id=&quot;gp-overview&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;gp-tab-overview&quot; data-panel=&quot;overview&quot;&gt;
      &lt;div class=&quot;card gp-decision&quot;&gt;
        &lt;div&gt;
          &lt;p class=&quot;text-small text-muted&quot;&gt;Decisão arquitetural&lt;/p&gt;
          &lt;h2&gt;RAG modular dentro da stack atual&lt;/h2&gt;
          &lt;p&gt;Next.js orquestra; Supabase/PostgreSQL autoriza, recupera e contabiliza; Anthropic sintetiza respostas citáveis; Stripe confirma reposições.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;gp-decision-list&quot; aria-label=&quot;Restrições principais&quot;&gt;
          &lt;span&gt;Sem banco vetorial externo&lt;/span&gt;
          &lt;span&gt;Somente leitura operacional&lt;/span&gt;
          &lt;span&gt;Sem scraping automático&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;h2&gt;Três fontes, uma autorização&lt;/h2&gt;
      &lt;div class=&quot;viz-grid gp-source-grid&quot;&gt;
        &lt;article class=&quot;card&quot;&gt;
          &lt;p class=&quot;text-small text-muted&quot;&gt;Fonte 1&lt;/p&gt;
          &lt;h3&gt;Dados estruturados&lt;/h3&gt;
          &lt;p&gt;Consultas tipadas e somente leitura sobre produção, mortalidade, ração, água, finanças, estoque, vendas, lotes e tarefas.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article class=&quot;card&quot;&gt;
          &lt;p class=&quot;text-small text-muted&quot;&gt;Fonte 2&lt;/p&gt;
          &lt;h3&gt;Documentos privados&lt;/h3&gt;
          &lt;p&gt;Arquivos da fazenda em Storage privado, processados de forma assíncrona, versionada e isolada por tenant.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article class=&quot;card&quot;&gt;
          &lt;p class=&quot;text-small text-muted&quot;&gt;Fonte 3&lt;/p&gt;
          &lt;h3&gt;Conhecimento global&lt;/h3&gt;
          &lt;p&gt;Base técnica separada, administrada pelo GranjaPro e alimentada somente por fontes explicitamente aprovadas.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;h2&gt;Princípios inegociáveis&lt;/h2&gt;
      &lt;ul class=&quot;gp-check-list&quot;&gt;
        &lt;li&gt;Autenticar cada chamada e autorizar a fazenda antes da recuperação.&lt;/li&gt;
        &lt;li&gt;Determinar plano, modo e custo no servidor; nunca confiar no cliente.&lt;/li&gt;
        &lt;li&gt;Reservar créditos antes do trabalho externo e capturar somente após resposta útil.&lt;/li&gt;
        &lt;li&gt;Filtrar o tenant antes do ranking, montagem de contexto ou geração.&lt;/li&gt;
        &lt;li&gt;Manter cálculos determinísticos fora do modelo sempre que possível.&lt;/li&gt;
        &lt;li&gt;Expor fontes estáveis e incerteza explícita nas respostas.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/section&gt;

    &lt;section id=&quot;gp-architecture&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;gp-tab-architecture&quot; data-panel=&quot;architecture&quot; hidden&gt;
      &lt;h2&gt;Fluxo de uma análise&lt;/h2&gt;
      &lt;div class=&quot;gp-flow&quot; role=&quot;img&quot; aria-label=&quot;Fluxo da pergunta do usuário até a resposta e captura de créditos&quot;&gt;
        &lt;div class=&quot;card gp-flow-node&quot;&gt;&lt;strong&gt;Interface&lt;/strong&gt;&lt;span&gt;pergunta + fazenda + nível&lt;/span&gt;&lt;/div&gt;
        &lt;span class=&quot;gp-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
        &lt;div class=&quot;card gp-flow-node&quot;&gt;&lt;strong&gt;API Next.js&lt;/strong&gt;&lt;span&gt;autentica e autoriza&lt;/span&gt;&lt;/div&gt;
        &lt;span class=&quot;gp-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
        &lt;div class=&quot;card gp-flow-node&quot;&gt;&lt;strong&gt;Ledger&lt;/strong&gt;&lt;span&gt;reserva atômica&lt;/span&gt;&lt;/div&gt;
        &lt;span class=&quot;gp-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
        &lt;div class=&quot;card gp-flow-node&quot;&gt;&lt;strong&gt;RAG&lt;/strong&gt;&lt;span&gt;recupera evidências&lt;/span&gt;&lt;/div&gt;
        &lt;span class=&quot;gp-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
        &lt;div class=&quot;card gp-flow-node&quot;&gt;&lt;strong&gt;Anthropic&lt;/strong&gt;&lt;span&gt;resposta citável&lt;/span&gt;&lt;/div&gt;
        &lt;span class=&quot;gp-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
        &lt;div class=&quot;card gp-flow-node&quot;&gt;&lt;strong&gt;Finalização&lt;/strong&gt;&lt;span&gt;captura ou libera&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;h2&gt;Recuperação por tipo de conhecimento&lt;/h2&gt;
      &lt;div class=&quot;table-responsive gp-wide-table&quot;&gt;
        &lt;table class=&quot;table&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Conhecimento&lt;/th&gt;&lt;th&gt;Origem&lt;/th&gt;&lt;th&gt;Estratégia&lt;/th&gt;&lt;th&gt;Frescor&lt;/th&gt;&lt;th&gt;Controle&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Operacional&lt;/td&gt;&lt;td&gt;Tabelas Supabase&lt;/td&gt;&lt;td&gt;RPCs/serviços tipados&lt;/td&gt;&lt;td&gt;Tempo real&lt;/td&gt;&lt;td&gt;RLS + autorização da API&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Documental privado&lt;/td&gt;&lt;td&gt;Storage da fazenda&lt;/td&gt;&lt;td&gt;Busca textual + pgvector&lt;/td&gt;&lt;td&gt;Por versão&lt;/td&gt;&lt;td&gt;farm_id antes do ranking&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Técnico global&lt;/td&gt;&lt;td&gt;Fontes aprovadas&lt;/td&gt;&lt;td&gt;Busca híbrida separada&lt;/td&gt;&lt;td&gt;Validade editorial&lt;/td&gt;&lt;td&gt;Ingestão administrativa&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;

      &lt;h2&gt;Pipeline de documentos&lt;/h2&gt;
      &lt;div class=&quot;gp-pipeline&quot; role=&quot;img&quot; aria-label=&quot;Pipeline de ingestão de documentos privados&quot;&gt;
        &lt;span&gt;Upload privado&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Validação&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Extração&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Normalização&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Chunks&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Embedding&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Índice híbrido&lt;/span&gt;
      &lt;/div&gt;

      &lt;h2&gt;Fronteiras de integração&lt;/h2&gt;
      &lt;ul class=&quot;gp-check-list&quot;&gt;
        &lt;li&gt;Transações do banco terminam antes de chamadas à Anthropic ou Stripe.&lt;/li&gt;
        &lt;li&gt;Jobs administrativos que ignoram RLS validam tenant e alvo explicitamente.&lt;/li&gt;
        &lt;li&gt;O conteúdo recuperado é tratado como dado não confiável, nunca como instrução.&lt;/li&gt;
        &lt;li&gt;O sistema de IA não recebe ferramentas de escrita sobre registros operacionais.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/section&gt;

    &lt;section id=&quot;gp-phases&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;gp-tab-phases&quot; data-panel=&quot;phases&quot; hidden&gt;
      &lt;div class=&quot;gp-section-heading&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;Plano em seis fases&lt;/h2&gt;
          &lt;p class=&quot;text-muted&quot;&gt;Cada fase exige plano detalhado, aprovação explícita, implementação e verificação antes da próxima.&lt;/p&gt;
        &lt;/div&gt;
        &lt;span class=&quot;viz-badge&quot;&gt;Estado: planejado&lt;/span&gt;
      &lt;/div&gt;

      &lt;div class=&quot;viz-controls gp-phase-controls&quot; role=&quot;group&quot; aria-label=&quot;Selecionar fase&quot;&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot; data-phase=&quot;1&quot;&gt;1 · Fundação&lt;/button&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-phase=&quot;2&quot;&gt;2 · Dados&lt;/button&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-phase=&quot;3&quot;&gt;3 · Documentos&lt;/button&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-phase=&quot;4&quot;&gt;4 · Base global&lt;/button&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-phase=&quot;5&quot;&gt;5 · Stripe&lt;/button&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-phase=&quot;6&quot;&gt;6 · Qualidade&lt;/button&gt;

      &lt;article class=&quot;card gp-phase-detail&quot; id=&quot;gp-phase-detail&quot; aria-live=&quot;polite&quot;&gt;&lt;/article&gt;

      &lt;h2&gt;Dependências entre fases&lt;/h2&gt;

        &lt;div&gt;&lt;span&gt;2&lt;/span&gt;&lt;strong&gt;Dados estruturados&lt;/strong&gt;&lt;/div&gt;
        &lt;div&gt;&lt;span&gt;3&lt;/span&gt;&lt;strong&gt;Documentos privados&lt;/strong&gt;&lt;/div&gt;
        &lt;div&gt;&lt;span&gt;4&lt;/span&gt;&lt;strong&gt;Conhecimento global&lt;/strong&gt;&lt;/div&gt;
        &lt;div&gt;&lt;span&gt;5&lt;/span&gt;&lt;strong&gt;Reposição&lt;/strong&gt;&lt;/div&gt;
        &lt;div&gt;&lt;span&gt;6&lt;/span&gt;&lt;strong&gt;Avaliação e rollout&lt;/strong&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section id=&quot;gp-credits&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;gp-tab-credits&quot; data-panel=&quot;credits&quot; hidden&gt;
      &lt;h2&gt;Níveis de análise&lt;/h2&gt;
      &lt;div class=&quot;table-responsive gp-wide-table&quot;&gt;
        &lt;table class=&quot;table&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Nível&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Créditos&lt;/th&gt;&lt;th&gt;Escopo&lt;/th&gt;&lt;th&gt;Recuperação&lt;/th&gt;&lt;th&gt;Resposta&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Simples&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;1&lt;/td&gt;&lt;td&gt;Um domínio, período curto&lt;/td&gt;&lt;td&gt;Limitada e objetiva&lt;/td&gt;&lt;td&gt;Resumo conciso&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Detalhada&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;3&lt;/td&gt;&lt;td&gt;Domínios relacionados&lt;/td&gt;&lt;td&gt;Comparação ampliada&lt;/td&gt;&lt;td&gt;Análise estruturada&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Diagnóstico&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;5&lt;/td&gt;&lt;td&gt;Todos os domínios relevantes&lt;/td&gt;&lt;td&gt;Histórico e cruzamentos&lt;/td&gt;&lt;td&gt;Diagnóstico + plano de ação&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;

      &lt;h2&gt;Franquias mensais&lt;/h2&gt;
      &lt;div class=&quot;viz-grid&quot;&gt;
        &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Essencial&lt;/span&gt;&lt;strong class=&quot;viz-stat-value&quot;&gt;15&lt;/strong&gt;&lt;span&gt;créditos por período&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Pro&lt;/span&gt;&lt;strong class=&quot;viz-stat-value&quot;&gt;30&lt;/strong&gt;&lt;span&gt;créditos por período&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Premium&lt;/span&gt;&lt;strong class=&quot;viz-stat-value&quot;&gt;60&lt;/strong&gt;&lt;span&gt;créditos por período&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;h2&gt;Máquina de estados do crédito&lt;/h2&gt;
      &lt;div class=&quot;gp-ledger-flow&quot; role=&quot;img&quot; aria-label=&quot;Estados de crédito disponível, reservado, consumido, liberado e expirado&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;strong&gt;Disponível&lt;/strong&gt;&lt;span&gt;grant mensal ou comprado&lt;/span&gt;&lt;/div&gt;
        &lt;span&gt;reserva →&lt;/span&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;strong&gt;Reservado&lt;/strong&gt;&lt;span&gt;requisição em andamento&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;gp-ledger-branches&quot;&gt;
          &lt;span&gt;sucesso → &lt;strong&gt;Consumido&lt;/strong&gt;&lt;/span&gt;
          &lt;span&gt;falha elegível → &lt;strong&gt;Disponível&lt;/strong&gt;&lt;/span&gt;
          &lt;span&gt;abandono → &lt;strong&gt;Reconciliação&lt;/strong&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;h2&gt;Invariantes&lt;/h2&gt;
      &lt;ol class=&quot;gp-number-list&quot;&gt;
        &lt;li&gt;Saldo disponível nunca fica negativo.&lt;/li&gt;
        &lt;li&gt;Todo comando econômico possui idempotency key única.&lt;/li&gt;
        &lt;li&gt;Lançamentos publicados são imutáveis.&lt;/li&gt;
        &lt;li&gt;Reserva, captura e liberação preservam a origem do grant.&lt;/li&gt;
        &lt;li&gt;Um evento Stripe ou Checkout Session produz no máximo um grant.&lt;/li&gt;
        &lt;li&gt;Requisições concorrentes não gastam o mesmo crédito.&lt;/li&gt;
        &lt;li&gt;Créditos mensais e comprados permanecem distinguíveis.&lt;/li&gt;
      &lt;/ol&gt;

      &lt;h2&gt;Reposição via Stripe&lt;/h2&gt;
      &lt;div class=&quot;gp-pipeline&quot; role=&quot;img&quot; aria-label=&quot;Fluxo de compra de créditos via Stripe&quot;&gt;
        &lt;span&gt;Checkout Session&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Pagamento&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Webhook assinado&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Inbox idempotente&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Grant no ledger&lt;/span&gt;
      &lt;/div&gt;
      &lt;p class=&quot;text-muted&quot;&gt;Pacotes e preços permanecem configuráveis e inativos até aprovação comercial.&lt;/p&gt;
    &lt;/section&gt;

    &lt;section id=&quot;gp-security&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;gp-tab-security&quot; data-panel=&quot;security&quot; hidden&gt;
      &lt;h2&gt;Mapa de controles&lt;/h2&gt;
      &lt;div class=&quot;table-responsive gp-wide-table&quot;&gt;
        &lt;table class=&quot;table&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Risco&lt;/th&gt;&lt;th&gt;Controle preventivo&lt;/th&gt;&lt;th&gt;Prova necessária&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Acesso entre granjas&lt;/td&gt;&lt;td&gt;RLS + autorização server-side + filtro antes do ranking&lt;/td&gt;&lt;td&gt;Testes adversariais entre tenants&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Manipulação do cliente&lt;/td&gt;&lt;td&gt;Plano, modo e custo derivados no servidor&lt;/td&gt;&lt;td&gt;Testes com payload adulterado&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Prompt injection&lt;/td&gt;&lt;td&gt;Conteúdo recuperado como dado; nenhuma ferramenta de escrita&lt;/td&gt;&lt;td&gt;Conjunto de documentos maliciosos&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Vazamento de credenciais&lt;/td&gt;&lt;td&gt;Service role somente no backend&lt;/td&gt;&lt;td&gt;Inspeção de bundle e configuração&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Excesso de dados pessoais&lt;/td&gt;&lt;td&gt;Minimização e pseudonimização antes do provedor&lt;/td&gt;&lt;td&gt;Testes e revisão dos payloads&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Exclusão incompleta&lt;/td&gt;&lt;td&gt;Orquestração de original, chunks, embeddings e metadados&lt;/td&gt;&lt;td&gt;Teste end-to-end de deleção&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Consumo ilimitado&lt;/td&gt;&lt;td&gt;Limites de mensagem, contexto, documento, tempo e retry&lt;/td&gt;&lt;td&gt;Testes de carga e abuso&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;

      &lt;h2&gt;Casos-limite obrigatórios&lt;/h2&gt;
      &lt;div class=&quot;gp-edge-grid&quot;&gt;
        &lt;section&gt;
          &lt;h3&gt;Identidade&lt;/h3&gt;
          &lt;p&gt;Não autenticado; sem acesso à fazenda; plano, custo ou saldo adulterado; tentativa cross-tenant.&lt;/p&gt;
        &lt;/section&gt;
        &lt;section&gt;
          &lt;h3&gt;Concorrência&lt;/h3&gt;
          &lt;p&gt;Envio duplicado; requisições simultâneas; deadlock; falha após resposta do provedor; reserva abandonada.&lt;/p&gt;
        &lt;/section&gt;
        &lt;section&gt;
          &lt;h3&gt;Documentos&lt;/h3&gt;
          &lt;p&gt;Arquivo corrompido, duplicado, removido ou malicioso; reprocessamento; nova versão; exclusão durante indexação.&lt;/p&gt;
        &lt;/section&gt;
        &lt;section&gt;
          &lt;h3&gt;Pagamentos&lt;/h3&gt;
          &lt;p&gt;Webhook duplicado ou fora de ordem; refund; chargeback; upgrade; downgrade; cancelamento; período de graça.&lt;/p&gt;
        &lt;/section&gt;
      &lt;/div&gt;

      &lt;h2&gt;Privacidade e LGPD&lt;/h2&gt;
      &lt;ul class=&quot;gp-check-list&quot;&gt;
        &lt;li&gt;Documentar finalidade, minimização, retenção e subprocessadores.&lt;/li&gt;
        &lt;li&gt;Avaliar retenção padrão versus acordo de zero data retention.&lt;/li&gt;
        &lt;li&gt;Definir mecanismo de transferência internacional aplicável.&lt;/li&gt;
        &lt;li&gt;Atualizar política e termos sem alegar conformidade apenas por controles técnicos.&lt;/li&gt;
        &lt;li&gt;Encaminhar decisões legais, contábeis e consumeristas para revisão qualificada.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/section&gt;

    &lt;section id=&quot;gp-validation&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;gp-tab-validation&quot; data-panel=&quot;validation&quot; hidden&gt;
      &lt;h2&gt;Critérios de conclusão&lt;/h2&gt;
      &lt;div class=&quot;gp-criteria-columns&quot;&gt;
        &lt;ol class=&quot;gp-number-list&quot;&gt;
          &lt;li&gt;API bloqueia usuários não autenticados.&lt;/li&gt;
          &lt;li&gt;Não há recuperação entre granjas.&lt;/li&gt;
          &lt;li&gt;Plano, modo e custo são server-side.&lt;/li&gt;
          &lt;li&gt;Reserva e finalização ocorrem uma única vez.&lt;/li&gt;
          &lt;li&gt;Concorrência não causa gasto duplo.&lt;/li&gt;
          &lt;li&gt;Dados reais substituem o contexto estático.&lt;/li&gt;
          &lt;li&gt;Cálculos determinísticos são testáveis.&lt;/li&gt;
          &lt;li&gt;Documentos funcionam ponta a ponta.&lt;/li&gt;
          &lt;li&gt;RLS protege documentos e vetores.&lt;/li&gt;
          &lt;li&gt;Base global rejeita fonte não aprovada.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;ol class=&quot;gp-number-list&quot; start=&quot;11&quot;&gt;
          &lt;li&gt;Afirmações documentais têm citações.&lt;/li&gt;
          &lt;li&gt;Prompt injection não concede poderes.&lt;/li&gt;
          &lt;li&gt;Fulfillment é assinado e idempotente.&lt;/li&gt;
          &lt;li&gt;Refunds geram compensações auditáveis.&lt;/li&gt;
          &lt;li&gt;Refresh não altera saldo real.&lt;/li&gt;
          &lt;li&gt;Falhas preservam invariantes.&lt;/li&gt;
          &lt;li&gt;Telemetria evita dados desnecessários.&lt;/li&gt;
          &lt;li&gt;Comportamentos não relacionados permanecem.&lt;/li&gt;
          &lt;li&gt;Testes focados passam.&lt;/li&gt;
          &lt;li&gt;Projeto compila e valida tipos.&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;

      &lt;h2&gt;Comandos e provas&lt;/h2&gt;
      &lt;pre&gt;&lt;code&gt;npm test
npx tsc --noEmit
npm run build&lt;/code&gt;&lt;/pre&gt;
      &lt;p class=&quot;text-muted&quot;&gt;Complementar com testes de RLS, concorrência do ledger, isolamento vetorial, Stripe fora de ordem e ingestão maliciosa.&lt;/p&gt;

      &lt;h2&gt;Riscos e decisões abertas&lt;/h2&gt;
      &lt;div class=&quot;table-responsive gp-wide-table&quot;&gt;
        &lt;table class=&quot;table table-sm&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Decisão&lt;/th&gt;&lt;th&gt;Impacto&lt;/th&gt;&lt;th&gt;Direção proposta&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Carteira por usuário ou assinatura&lt;/td&gt;&lt;td&gt;Franquias podem se multiplicar&lt;/td&gt;&lt;td&gt;Conta pagante compartilhada&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Embedding e parser&lt;/td&gt;&lt;td&gt;Custo, privacidade e dependências&lt;/td&gt;&lt;td&gt;Avaliar e aprovar antes da fase 3&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Expiração de créditos comprados&lt;/td&gt;&lt;td&gt;Experiência e passivo econômico&lt;/td&gt;&lt;td&gt;Decisão comercial e jurídica explícita&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Retenção no provedor&lt;/td&gt;&lt;td&gt;LGPD e exclusão&lt;/td&gt;&lt;td&gt;Revisar DPA, ZDR e transferências&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Fontes técnicas globais&lt;/td&gt;&lt;td&gt;Qualidade e licenciamento&lt;/td&gt;&lt;td&gt;Curadoria e aprovação individual&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Preços dos pacotes&lt;/td&gt;&lt;td&gt;Margem e tributação&lt;/td&gt;&lt;td&gt;Configurar somente após decisão&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;

      &lt;h2&gt;Rollout&lt;/h2&gt;
      &lt;div class=&quot;gp-pipeline&quot; role=&quot;img&quot; aria-label=&quot;Etapas de rollout do RAG&quot;&gt;
        &lt;span&gt;Testes locais&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Equipe interna&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Fazendas piloto&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Percentual gradual&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;Disponibilidade geral&lt;/span&gt;
      &lt;/div&gt;
      &lt;p class=&quot;text-muted&quot;&gt;Feature flags preservam o assistente existente e permitem rollback sem migração destrutiva.&lt;/p&gt;
    &lt;/section&gt;
  &lt;/main&gt;

  &lt;div id=&quot;gp-rag-live&quot; class=&quot;sr-only&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;granjapro-rag-plan&quot;);
    if (!root) return;

    const live = root.querySelector(&quot;#gp-rag-live&quot;);
    const tabButtons = Array.from(root.querySelectorAll(&quot;[data-section]&quot;));
    const panels = Array.from(root.querySelectorAll(&quot;[data-panel]&quot;));

    const activateSection = (section) =&gt; {
      tabButtons.forEach((button) =&gt; {
        const active = button.dataset.section === section;
        button.setAttribute(&quot;aria-selected&quot;, String(active));
      });
      panels.forEach((panel) =&gt; {
        panel.hidden = panel.dataset.panel !== section;
      });
      if (live) {
        const label = tabButtons.find((button) =&gt; button.dataset.section === section)?.textContent?.trim() || section;
        live.textContent = `Seção ${label} aberta.`;
      }
    };

    tabButtons.forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; activateSection(button.dataset.section));
      button.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        if (event.key !== &quot;ArrowRight&quot; &amp;&amp; event.key !== &quot;ArrowLeft&quot;) return;
        event.preventDefault();
        const currentIndex = tabButtons.indexOf(button);
        const offset = event.key === &quot;ArrowRight&quot; ? 1 : -1;
        const next = tabButtons[(currentIndex + offset + tabButtons.length) % tabButtons.length];
        next.focus();
        activateSection(next.dataset.section);
      });
    });

    const phases = {
      1: {
        title: &quot;Segurança e fundação de créditos&quot;,
        objective: &quot;Transformar autenticação, autorização e cobrança em controles server-side antes de conectar dados reais ao modelo.&quot;,
        deliverables: [&quot;API autenticada por usuário e fazenda&quot;, &quot;Wallet, grants, holds, ledger e ai_requests&quot;, &quot;Reserva, captura, liberação e reconciliação&quot;, &quot;Rate limits e remoção da compra simulada&quot;],
        done: &quot;Payload adulterado não muda plano, custo ou saldo; concorrência não permite gasto duplo.&quot;,
        depends: &quot;Nenhuma fase técnica anterior. Exige decisão sobre proprietário da carteira.&quot;
      },
      2: {
        title: &quot;RAG com dados estruturados&quot;,
        objective: &quot;Substituir o contexto estático por métricas reais, frescas e autorizadas da fazenda.&quot;,
        deliverables: [&quot;Catálogo fechado de consultas tipadas&quot;, &quot;Agregações determinísticas por domínio&quot;, &quot;Proveniência de cada valor&quot;, &quot;Escopo variável para 1, 3 e 5 créditos&quot;],
        done: &quot;Respostas usam dados reais e recusam ou limitam a análise quando a evidência é insuficiente.&quot;,
        depends: &quot;Fase 1 concluída e ledger operacional.&quot;
      },
      3: {
        title: &quot;Documentos privados&quot;,
        objective: &quot;Permitir upload, ingestão, busca híbrida, citação, versionamento e exclusão de documentos por fazenda.&quot;,
        deliverables: [&quot;Storage privado e metadata RLS&quot;, &quot;Pipeline assíncrono idempotente&quot;, &quot;Chunks, embeddings e busca híbrida&quot;, &quot;Exclusão completa de dados derivados&quot;],
        done: &quot;Documento autorizado aparece como fonte; outro tenant não consegue localizá-lo nem inferi-lo.&quot;,
        depends: &quot;Fases 1 e 2; escolha aprovada de embeddings, parser e mecanismo de fila.&quot;
      },
      4: {
        title: &quot;Base técnica global&quot;,
        objective: &quot;Oferecer conhecimento avícola citável sem misturar propriedade, retenção ou autorização com dados privados.&quot;,
        deliverables: [&quot;Namespace global separado&quot;, &quot;Ingestão administrativa&quot;, &quot;Metadados de autoridade, licença e validade&quot;, &quot;Combinação controlada com evidência privada&quot;],
        done: &quot;Somente fontes aprovadas entram na base e fontes vencidas ou substituídas perdem prioridade.&quot;,
        depends: &quot;Fase 3 e lista inicial de fontes aprovada pelo usuário.&quot;
      },
      5: {
        title: &quot;Reposição de créditos via Stripe&quot;,
        objective: &quot;Conceder créditos comprados somente após confirmação financeira idempotente e auditável.&quot;,
        deliverables: [&quot;Checkout de pagamento único&quot;, &quot;Inbox de eventos Stripe&quot;, &quot;Fulfillment idempotente&quot;, &quot;Compensações para refund e chargeback&quot;],
        done: &quot;Webhook duplicado ou fora de ordem não duplica grants; preços permanecem configuráveis.&quot;,
        depends: &quot;Fase 1 e decisões comerciais sobre pacotes, expiração e cancelamento.&quot;
      },
      6: {
        title: &quot;Avaliação, observabilidade e rollout&quot;,
        objective: &quot;Demonstrar qualidade, segurança, custo e recuperabilidade antes da disponibilidade geral.&quot;,
        deliverables: [&quot;Telemetria sem dados pessoais desnecessários&quot;, &quot;Evals de recuperação, citações e segurança&quot;, &quot;Feature flags e rollback&quot;, &quot;Piloto e expansão gradual&quot;],
        done: &quot;Os 20 critérios de aceitação passam e o sistema pode retornar ao assistente anterior sem perda de dados.&quot;,
        depends: &quot;Todas as capacidades anteriores implementadas e verificadas.&quot;
      }
    };

    const phaseDetail = root.querySelector(&quot;#gp-phase-detail&quot;);
    const phaseButtons = Array.from(root.querySelectorAll(&quot;[data-phase]&quot;));

    const renderPhase = (phaseNumber) =&gt; {
      const phase = phases[phaseNumber];
      if (!phase || !phaseDetail) return;
      phaseDetail.innerHTML = `
        &lt;div class=&quot;gp-section-heading&quot;&gt;
          &lt;div&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;Fase ${phaseNumber}&lt;/p&gt;&lt;h3&gt;${phase.title}&lt;/h3&gt;&lt;/div&gt;
          &lt;span class=&quot;viz-badge&quot;&gt;Planejada&lt;/span&gt;
        &lt;/div&gt;
        &lt;p&gt;${phase.objective}&lt;/p&gt;
        &lt;div class=&quot;gp-phase-grid&quot;&gt;
          &lt;div&gt;&lt;strong&gt;Entregáveis&lt;/strong&gt;&lt;ul class=&quot;gp-check-list&quot;&gt;${phase.deliverables.map((item) =&gt; `&lt;li&gt;${item}&lt;/li&gt;`).join(&quot;&quot;)}&lt;/ul&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;Condição de conclusão&lt;/strong&gt;&lt;p&gt;${phase.done}&lt;/p&gt;&lt;strong&gt;Dependências&lt;/strong&gt;&lt;p&gt;${phase.depends}&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;`;
      phaseButtons.forEach((button) =&gt; button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.phase === String(phaseNumber))));
      if (live) live.textContent = `Fase ${phaseNumber}, ${phase.title}, selecionada.`;
    };

    phaseButtons.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; renderPhase(button.dataset.phase)));
    renderPhase(&quot;1&quot;);
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
